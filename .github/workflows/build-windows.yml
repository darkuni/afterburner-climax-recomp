name: Build Windows

# Every push to main builds the package (download it from the run's "Artifacts").
# Publishing a GitHub Release (or pushing a v* tag) also attaches the zip to that release.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  REXGLUE_SDK_REF: v0.9.0
  # Prebuilt package from darkuni/rexglue-sdk-builds: the same patch level as OutRun
  # (p23: XMA start/end skip honoured, hardware-like XMA start latency, ...).
  REXGLUE_SDK_PKG: v0.9.0-p23

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install LLVM (clang 20+) and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      
      - name: MSVC environment (headers/libs for clang)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain versions
        shell: pwsh
        run: |
          clang++ --version
          cmake --version
          ninja --version

      # ---------- ReXGlue SDK ----------
      # 1) Prebuilt package from darkuni/rexglue-sdk-builds (fast path).
      # 2) Fallback: this repo's cache, else compile the SDK here.
      - name: Download prebuilt SDK
        id: sdk-prebuilt
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://github.com/darkuni/rexglue-sdk-builds/releases/download/sdk-$env:REXGLUE_SDK_PKG/rexglue-sdk-$env:REXGLUE_SDK_PKG-win-amd64-release.zip"
          Invoke-WebRequest -Uri $url -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath rexglue-sdk-install
          Get-Content rexglue-sdk-install\BUILD_INFO.txt
          "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore SDK install cache
        id: sdk-cache
        if: steps.sdk-prebuilt.outputs.ok != 'true'
        uses: actions/cache@v4
        with:
          path: rexglue-sdk-install
          key: rexglue-sdk-${{ env.REXGLUE_SDK_PKG }}-win-amd64

      - name: Keep LF line endings (SDK patches are LF)
        if: steps.sdk-prebuilt.outputs.ok != 'true' && steps.sdk-cache.outputs.cache-matched-key == ''
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout ReXGlue SDK
        if: steps.sdk-prebuilt.outputs.ok != 'true' && steps.sdk-cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: ${{ env.REXGLUE_SDK_REF }}
          path: rexglue-sdk
          submodules: recursive

      - name: Checkout SDK patches
        if: steps.sdk-prebuilt.outputs.ok != 'true' && steps.sdk-cache.outputs.cache-matched-key == '' && env.REXGLUE_SDK_PKG != env.REXGLUE_SDK_REF
        uses: actions/checkout@v4
        with:
          repository: darkuni/rexglue-sdk-builds
          path: sdk-builds

      - name: Build and install SDK
        if: steps.sdk-prebuilt.outputs.ok != 'true' && steps.sdk-cache.outputs.cache-matched-key == ''
        shell: pwsh
        working-directory: rexglue-sdk
        run: |
          # Stock package (PKG == REF): no patches. Otherwise apply sdk-builds patches/.
          Get-ChildItem ..\sdk-builds\patches\*.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            git apply --ignore-whitespace --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cmake --preset win-amd64 `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DREXGLUE_ENABLE_TRACY=OFF `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/rexglue-sdk-install"
          cmake --build out/build/win-amd64 --config Release --target install --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------- Game ----------
      - name: Compiler cache for generated code
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: after-burner-climax-win-amd64

      - name: Configure game
        shell: pwsh
        run: |
          cmake -S . -B out -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/rexglue-sdk-install"

      - name: Build game
        shell: pwsh
        run: |
          cmake --build out --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\after_burner_climax.exe dist\
          Get-ChildItem out -Filter *.dll | Copy-Item -Destination dist\
          Get-ChildItem "$env:GITHUB_WORKSPACE\rexglue-sdk-install\bin" -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { -not (Test-Path ("dist\" + $_.Name)) } | Copy-Item -Destination dist\
          @"
          After Burner Climax - native Windows build (ReXGlue static recompilation)
          https://github.com/darkuni/afterburner-climax-recomp

          Game files are NOT included. You need your own After Burner Climax XBLA package
          (the Xbox 360 LIVE file from your console's storage).

          Setup (once)
            1. Install Python 3 from python.org (tick "Add python.exe to PATH").
            2. Drag your package file onto extract-package.bat. It creates the "assets" folder.
               (Already extracted? Copy default.xex, the media folder, etc. into "assets" instead.)
            3. Run after_burner_climax.exe. If Windows says a DLL (e.g. VCRUNTIME140.dll) is missing,
               install the Microsoft Visual C++ Redistributable 2015-2022 (x64): https://aka.ms/vs/17/release/vc_redist.x64.exe

          F1 / Esc: settings (display mode, resolution, VSync, aspect, filtering, audio, keys). F11: fullscreen.
          F3: performance overlay. Settings are saved in after_burner_climax.toml.
          Controls: left stick / arrows = fly, A / Z = machine gun, B / X = missiles, LB RB / C V = Climax,
          LT RT / A S = brake / accelerate, Start / Enter, Back / Backspace.

          Unofficial fan project, not affiliated with or endorsed by SEGA or Microsoft. The exe contains code
          machine-translated from the game's executable; game data comes from your own package.
          ReXGlue SDK: BSD-3-Clause (portions from Xenia) - see licenses\.
          "@ | Out-File dist\README.txt -Encoding utf8
          Copy-Item dist-files\extract-package.bat dist\
          New-Item -ItemType Directory -Force dist\tools, dist\licenses | Out-Null
          Copy-Item tools\stfs_extract.py dist\tools\
          Copy-Item LICENSE dist\licenses\after-burner-climax-recomp-LICENSE.txt
          if (Test-Path "$env:GITHUB_WORKSPACE\rexglue-sdk-install\share\licenses") {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\rexglue-sdk-install\share\licenses\*" dist\licenses\
          }
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: after_burner_climax-win-amd64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "AfterBurnerClimax-$env:GITHUB_REF_NAME-win64.zip"
          New-Item -ItemType Directory -Force pkg\AfterBurnerClimax | Out-Null
          Copy-Item -Recurse dist\* pkg\AfterBurnerClimax\
          Compress-Archive -Path pkg\AfterBurnerClimax -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
